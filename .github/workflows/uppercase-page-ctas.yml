name: Uppercase page CTAs
on:
  push:
    paths:
      - '.github/workflows/uppercase-page-ctas.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uppercase header CTA labels
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'book-shoot.html': [('>Schedule Consultation</a>', '>SCHEDULE CONSULTATION</a>')],
              'schedule-consultation.html': [('>Book a Shoot</a>', '>BOOK A SHOOT</a>')],
          }
          for filename, pairs in replacements.items():
              p = Path(filename)
              s = p.read_text()
              for old, new in pairs:
                  s = s.replace(old, new)
              p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book-shoot.html schedule-consultation.html
          git diff --cached --quiet || git commit -m "Uppercase shoot and consultation header buttons"
          git push
