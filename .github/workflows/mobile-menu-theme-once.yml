name: Apply mobile menu theme once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-menu-theme-once.yml'

permissions:
  contents: write

jobs:
  update-mobile-menu-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Match mobile CTA buttons to site theme
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old_variants = (
              'border:1px solid rgba(46,192,252,.65);border-radius:999px;background:#2ec0fc;color:#fff;',
              'border:1px solid rgba(46,192,252,.65);border-radius:999px;background:var(--blue);color:#fff;',
          )
          new = 'border:1px solid rgba(127,224,220,.48);border-radius:999px;background:rgba(127,224,220,.08);color:var(--accent2);'

          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = text
              for old in old_variants:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.name)

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit changes and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mobile-menu-theme-once.yml
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Match mobile menu buttons to site theme'
          git push origin main
