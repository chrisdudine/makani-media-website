name: Update consultation CTA
on:
  push:
    paths:
      - '.github/workflows/update-consultation-cta.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update consultation CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('schedule-consultation.html')
          s = p.read_text()
          s = s.replace('<a class="navcta" href="#form">Schedule Consultation</a>', '<a class="navcta" href="book-shoot.html">Book a Shoot</a>')
          s = s.replace('<a class="mobile-cta" href="#form">Schedule Consultation</a><a class="mobile-cta" href="book-shoot.html">Book a Shoot</a>', '<a class="mobile-cta" href="book-shoot.html">Book a Shoot</a>')
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule-consultation.html
          git diff --cached --quiet || git commit -m "Change consultation header CTA to Book a Shoot"
          git push
